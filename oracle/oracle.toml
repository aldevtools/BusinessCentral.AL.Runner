# One [[version]] table per BC major (ADR-015). The oracle of a major is the CI leg of its
# newest minor. `corpus_commit` is the pin (the `corpus` submodule). A JUnit file comes from the
# CI run of the pin, or of the commit named by the version's own `corpus_commit`, which the CLI
# accepts only when the corpus diff since that commit adds files under tests/ and changes none
# (ADR-007).
#
# `bc_build` pins the Microsoft build the runtime loads for that major (Base Application, test
# libraries, demo data): local runs and CI load the same apps, and a build Microsoft publishes later
# changes no result until the pin is moved on purpose (the not-passing lists are recorded against it).
# The artifact cache key of CI follows the pin (`--print-builds`).
corpus_repo = "corpus"
corpus_app = "corpus/tests/al-language"
corpus_commit = "6e3fbaf30db077bd30faab86ed746893fe857230"
# ADR-046 amendment 4: the corpus CI database has two companies, the session company first
# (install/lt-bf-install-probes/BfInstallTests.al:60-62).
companies = ["CRONUS International Ltd.", "My Company"]

[[version]]
major = 27
app_runtime = "16.1"
bc_version = "27.5"
bc_build = "27.5.46862.56249"
workflow_run = 43057619222
artifact_id = 13874154111
junit = "27/junit.xml"
baseline = "metrics/27/not-passing.txt"

[[version.suite]]
name = "onprem"
app = "corpus/tests/al-language-onprem"
workflow_run = 43057619222
artifact_id = 13874205260
oracle = "27/junit-onprem.xml"
baseline = "metrics/27/not-passing-onprem.txt"

[[version.suite]]
name = "onprem-dotnet"
app = "corpus/tests/al-language-onprem-dotnet"
workflow_run = 43057619222
artifact_id = 13871574914
oracle = "27/junit-dotnet.xml"
baseline = "metrics/27/not-passing-dotnet.txt"

# The corpus job "BC TestLibraries <ver> / test" installs Microsoft's Tests-TestLibraries and Data Archive apps
# (corpus .github/workflows/ci.yml, job test-testlibraries, `extra_apps`). The suite runs in an environment of its own
# with them; the main app's environment stays without them.
[[version.suite]]
name = "testlibraries"
app = "corpus/tests/al-language-testlibraries"
workflow_run = 43057619222
artifact_id = 13873319684
oracle = "27/junit-testlibraries.xml"
baseline = "metrics/27/not-passing-testlibraries.txt"
extra_apps = [
  { id = "5d86850b-0d76-4eca-bd7b-951ad998e997", name = "Tests-TestLibraries" },
  { id = "7819d79d-feea-4f09-bbed-5bbaca4bf323", name = "Data Archive" },
]
# The cross-app default test handler fixtures (corpus PR 1193): CI publishes them in this job only.
extra_dirs = [
  "corpus/tests/al-language-xhandler-lib",
  "corpus/tests/al-language-xhandler-a",
  "corpus/tests/al-language-xhandler-c",
  "corpus/tests/al-language-xhandler-d",
]

[[version.suite]]
name = "trywrite-allowed"
app = "corpus/tests/al-language-trywrite-allowed"
workflow_run = 43057619222
artifact_id = 13874516574
oracle = "27/junit-trywrite-allowed.xml"
baseline = "metrics/27/not-passing-trywrite-allowed.txt"
# The corpus job "BC TryWrites" (corpus .github/workflows/ci.yml, job test-trywrite-allowed, `server_settings`).
server_settings = ["DisableWriteInsideTryFunctions=false"]

