# with them; the main app's environment stays without them.
[[version.suite]]
name = "testlibraries"
app = "corpus/tests/al-language-testlibraries"
workflow_run = 41155809332
artifact_id = 13024204765
oracle = "27/junit-testlibraries.xml"
baseline = "metrics/27/passing-testlibraries.txt"
extra_apps = [
