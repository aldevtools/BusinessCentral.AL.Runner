# One [[version]] table per BC major (ADR-015). The oracle of a major is the CI leg of its
# newest minor. `corpus_commit` is the pin (the `corpus` submodule). A JUnit file comes from the
# CI run of the pin, or of the commit named by the version's own `corpus_commit`, which the CLI
# accepts only when the corpus diff since that commit adds files under tests/ and changes none
# (ADR-007).
#
# `bc_build` pins the Microsoft build the runtime loads for that major (Base Application, test
# libraries, demo data): local runs and CI load the same apps, and a build Microsoft publishes later
# changes no result until the pin is moved on purpose (the ratchet baselines are recorded against it).
# The artifact cache key of CI follows the pin (`--print-builds`).
corpus_repo = "corpus"
corpus_app = "corpus/tests/al-language"
corpus_commit = "c4d4ce2f443986044434b1f617ea7d16041bee48"

[[version]]
major = 27
app_runtime = "16.1"
bc_version = "27.5"
bc_build = "27.5.46862.56249"
workflow_run = 39630456170
artifact_id = 12361780322
junit = "27/junit.xml"
baseline = "metrics/27/passing.txt"

[[version.suite]]
name = "onprem"
app = "corpus/tests/al-language-onprem"
workflow_run = 39630456170
artifact_id = 12358938404
oracle = "27/junit-onprem.xml"
baseline = "metrics/27/passing-onprem.txt"

