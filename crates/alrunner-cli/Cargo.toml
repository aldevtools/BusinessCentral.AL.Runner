[package]
name = "alrunner-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"
description = "al-runner: the user command line of AL Runner v3 (ADR-016)"

[[bin]]
name = "al-runner"
path = "src/main.rs"

[features]
# Links mimalloc as the global allocator (ADR-016: musl's allocator is slow).
mimalloc = ["dep:mimalloc"]

[dependencies]
al-bcdb-std = { path = "../al-bcdb-std" }
al-rapidstart = { path = "../al-rapidstart" }
al-builtins.workspace = true
al-deps.workspace = true
al-host.workspace = true
al-ir.workspace = true
al-sema.workspace = true
al-syntax.workspace = true
al-testrun.workspace = true
al-version.workspace = true
al-vm.workspace = true
serde_json.workspace = true
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
mimalloc = { version = "0.1", optional = true }

[dev-dependencies]
al-testkit.workspace = true
tempfile = "3"
