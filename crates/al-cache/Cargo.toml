[package]
name = "al-cache"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The compile cache format (ADR-022): a set of lowered dependency objects, keyed, compressed per object. Bytes in, bytes out; no OS access (ADR-006)."

[dependencies]
al-sema.workspace = true
al-ir.workspace = true
serde.workspace = true
postcard = { version = "1", features = ["use-std"] }
zstd = "0.13"
sha2 = "0.10"
crc32fast = "1"
rayon = "1"
