[package]
name = "al-testrun"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
al-data.workspace = true
al-deps.workspace = true
al-sema.workspace = true
al-vm.workspace = true
al-builtins.workspace = true
al-ir.workspace = true
al-version.workspace = true
al-host.workspace = true
serde_json.workspace = true
serde.workspace = true
al-cache.workspace = true
sha2 = "0.10"
rayon = "1"
al-syntax.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# The versions al-cache uses: a test rewrites the extra section of a workspace entry (`tests/suite/workspace_cache.rs`).
postcard = { version = "1", features = ["use-std"] }
zstd = "0.13"
al-testfiles.workspace = true
