[package]
name = "al-test-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# On by default. The tests that run the built `al-test-cli` over the whole pinned corpus
# (`corpus_harness`, `dev_tooling`) need this feature. CI's debug test job builds with
# `--no-default-features` and the release job runs them against the release binary, about ten
# times faster than the unoptimised one; the CI workflow explains the split, and check.sh splits
# the tests the same way. Never turn it off
# to skip a failing test.
default = ["cli-e2e", "mimalloc"]
cli-e2e = []
# Links mimalloc as the global allocator (ADR-016: musl's allocator is slow). On by default: with
# glibc malloc a full corpus run made about 200,000 mprotect calls (per-thread arena growth) and spent a
# quarter of its CPU time in the kernel; with mimalloc the run is about a fifth faster.
mimalloc = ["dep:mimalloc"]

[[test]]
name = "corpus_harness"
required-features = ["cli-e2e"]

[[test]]
name = "dev_tooling"
required-features = ["cli-e2e"]

[dependencies]
al-data.workspace = true
al-deps.workspace = true
al-sema.workspace = true
al-syntax.workspace = true
al-vm.workspace = true
al-builtins.workspace = true
al-ir.workspace = true
al-version.workspace = true
al-host.workspace = true
al-testrun.workspace = true
quick-xml.workspace = true
rayon = "1"
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# mimalloc 2, not 3 (the crate's default): with 3 the VM's text and record loops cost 1 to 4 % more instructions
# (perf_vm) and the cold compile 1 % more; with 2 every budget is lower than with the system allocator.
mimalloc = { version = "0.1", optional = true, features = ["v2"] }

[dev-dependencies]
tempfile = "3"
libc = "0.2"
al-testkit = { workspace = true, features = ["runner"] }
al-testfiles.workspace = true
al-syntax.workspace = true
serde_json = "1"
