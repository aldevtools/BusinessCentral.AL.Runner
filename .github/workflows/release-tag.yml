name: Release

# A numbered alpha: push a tag v3.* on a commit of the `release` branch (docs/releasing.md).
# The workflow checks the tag, runs the CI checks, builds and smoke tests the four targets and
# creates a normal GitHub release (not a draft, not a pre-release) marked "latest", so that
# `mise use github:aldevtools/BusinessCentral.AL.Runner` and `mise up` find it (owner decision 2026-10-20).
# Assets: al-runner-<version>-<target>.tar.xz or .zip, SHA256SUMS, install.sh, install.ps1.
# The same binaries also go to nuget.org as the .NET tool MSDyn365BC.AL.Runner (packaging/dotnet-tool,
# owner decision 2026-10-25), after the GitHub release. The edge build (edge.yml) does not publish it.
# workflow_dispatch is a dry run: it builds, packages and smoke tests but creates no release and
# pushes nothing to NuGet.

on:
  push:
    tags: ["v3.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml)"
          [ -n "$version" ] || { echo "::error::no workspace version in Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "Dry run: no release will be created."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not equal the crate version v$version"
            exit 1
          fi
          git fetch origin release
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/release; then
            echo "::error::the commit of tag $GITHUB_REF_NAME is not on the release branch"
            exit 1
          fi

  # The same checks as every push: ci.yml, reused.
  test:
    needs: plan
    uses: ./.github/workflows/ci.yml
    # A called workflow gets at most the caller's permissions. ci.yml's cache-cleanup job asks for
    # actions: write (it runs only on a push to main, but the request is checked at start-up).
    # Without this grant the run ends in startup_failure.
    permissions:
      actions: write
      contents: read

  package:
    needs: [plan, test]
    uses: ./.github/workflows/build-packages.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      label: ${{ needs.plan.outputs.version }}
      sha: ${{ github.sha }}

  # The .NET tool: test the wrapper with a fake binary, then pack the release binaries.
  nuget-pack:
    needs: [plan, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Test the wrapper
        run: packaging/dotnet-tool/test.sh "$RUNNER_TEMP/wrapper-test"
      - name: Pack
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: packaging/dotnet-tool/pack.sh "$VERSION" dist nupkg
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: nupkg/*.nupkg
          if-no-files-found: error

  # Install the package on each OS it carries a binary for and run the smoke test through it.
  nuget-smoke:
    needs: [plan, nuget-pack]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: nupkg
      - name: Install the tool and run the smoke test
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: packaging/dotnet-tool/smoke.sh nupkg "$VERSION"

  release:
    needs: [plan, package, nuget-smoke]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Check the version the binary prints
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          mkdir bin
          tar -C bin -xJf "dist/al-runner-$VERSION-x86_64-unknown-linux-musl.tar.xz"
          printed="$(./bin/al-runner --version)"
          echo "$printed"
          case "$printed" in
            "al-runner $VERSION "*|"al-runner $VERSION") ;;
            *) echo "::error::al-runner --version prints '$printed', not version $VERSION of tag $GITHUB_REF_NAME"; exit 1 ;;
          esac
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          cat > notes.md <<NOTES
          al-runner $VERSION. An alpha: no AL Runner v2 parity, some tests are refused ("not run")
          with a reason, and results may change.

          The Windows binary is signed (Azure Trusted Signing). The macOS and Linux binaries are
          not signed. See https://aldev.tools/al-runner/getting-started/ for the macOS steps. Install:

          - mise: \`mise use -g github:$GH_REPO\`, and \`mise up\` to update
          - Linux and macOS: \`curl -fsSL https://github.com/$GH_REPO/releases/download/$GITHUB_REF_NAME/install.sh | sh -s -- $GITHUB_REF_NAME\`
          - Windows: download \`install.ps1\` from this release and run \`./install.ps1 -Version $GITHUB_REF_NAME\`

          Check a download with \`SHA256SUMS\`, or with \`gh attestation verify FILE --repo $GH_REPO\`.
          Report problems, especially wrong results, as GitHub issues.
          NOTES
          sed -i 's/^          //' notes.md
          # A normal release, marked latest. The commit list follows the fixed text (--generate-notes).
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --latest --generate-notes \
            --title "al-runner $VERSION" --notes-file notes.md

  # After the GitHub release, so a failed release never leaves a package on NuGet without it.
  # A version on nuget.org cannot be replaced: --skip-duplicate makes a re-run a no-op.
  nuget-push:
    needs: [plan, release]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: nupkg
      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push nupkg/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
