name: Build packages

# Builds al-runner for the three alpha targets, smoke tests each binary, packages it and attests it.
# Used by release-tag.yml (numbered alphas, and the dry run) and edge.yml (the rolling edge build).
# The Windows binary is Authenticode-signed with Azure Trusted Signing before it is packaged; the
# Linux and macOS binaries are not signed.
# Output: the artifact "packages" holding the archives and one SHA256SUMS. Nothing of Microsoft's
# is built in or downloaded here: the smoke test runs a fixture project of this repository.

on:
  workflow_call:
    inputs:
      label:
        description: Name used in the archive file names, for example "3.0.0-alpha.2" or "edge".
        required: true
        type: string
      sha:
        description: The commit to build.
        required: true
        type: string
      version_suffix:
        description: Build metadata appended to the version, for example "+edge.20261021". Empty for a numbered release.
        required: false
        type: string
        default: ""
      attest:
        description: Create a build provenance attestation for each archive.
        required: false
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  # Thin LTO and stripped symbols for the shipped binaries (ADR-016). Set here, not in Cargo.toml,
  # so local release builds keep their fast link.
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_STRIP: symbols
  ALRUNNER_COMMIT: ${{ inputs.sha }}
  ALRUNNER_VERSION_SUFFIX: ${{ inputs.version_suffix }}

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # Only the Windows job signs, and only it needs the environment "release": the Entra federated
    # credential trusts the OIDC subject
    # repo:aldevtools@326818346/BusinessCentral.AL.Runner@1206772003:environment:release
    # (this repository uses immutable subjects). An empty name means no environment.
    environment: ${{ matrix.target == 'x86_64-pc-windows-msvc' && 'release' || '' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            ext: tar.xz
            # musl's allocator is slow, so this build links mimalloc (ADR-016).
            features: --features mimalloc
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: zip
            features: ""
          - target: aarch64-apple-darwin
            os: macos-14
            ext: tar.xz
            features: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          # The corpus is not needed to build or smoke test the binary.
          submodules: false
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-${{ matrix.target }}
      - name: Install the musl C compiler (for mimalloc)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        run: cargo build --release --locked -p alrunner-cli --target ${{ matrix.target }} ${{ matrix.features }}
      - name: Smoke test
        shell: bash
        run: |
          exe=target/${{ matrix.target }}/release/al-runner
          [ "${{ matrix.ext }}" = zip ] && exe="$exe.exe"
          release/smoke.sh "$exe"
      - name: Fetch a federated OIDC token for the signing service
        # azure/artifact-signing-action authenticates with Azure.Identity's workload identity
        # credential. That credential reads AZURE_FEDERATED_TOKEN_FILE, a file holding a GitHub
        # OIDC token with the audience api://AzureADTokenExchange. Nothing writes that file by
        # itself, so this step does. No client secret is involved (same setup as v2's publish.yml).
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const token = await core.getIDToken('api://AzureADTokenExchange');
            const tokenPath = path.join(process.env.RUNNER_TEMP, 'azure-federated-token.txt');
            fs.writeFileSync(tokenPath, token);
            core.exportVariable('AZURE_FEDERATED_TOKEN_FILE', tokenPath);
      - name: List the file to sign
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $exe = Join-Path '${{ github.workspace }}' 'target\${{ matrix.target }}\release\al-runner.exe'
          if (-not (Test-Path $exe)) { Write-Error "Missing $exe"; exit 1 }
          # The action resolves each catalog line against the catalog's own folder, so the catalog
          # sits next to the exe and names it without a path.
          $catalog = Join-Path (Split-Path $exe) 'sign-catalog.txt'
          Set-Content -Path $catalog -Value 'al-runner.exe'
          "SIGN_CATALOG=$catalog" >> $env:GITHUB_ENV
          "SIGN_EXE=$exe" >> $env:GITHUB_ENV
      - name: Sign al-runner.exe with Azure Trusted Signing
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.SIGNING_CERT_PROFILE_NAME }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          exclude-workload-identity-credential: false
          files-catalog: ${{ env.SIGN_CATALOG }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify the signature
        # Get-AuthenticodeSignature checks the chain of trust, not only that a signature exists.
        # Anything but Valid fails the build, so an unsigned or badly signed exe never ships.
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature $env:SIGN_EXE
          Write-Host "$($env:SIGN_EXE) -> $($sig.Status) $($sig.StatusMessage)"
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          Write-Host "Timestamp: $($sig.TimeStamperCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            Write-Error "al-runner.exe is not validly signed: $($sig.Status) $($sig.StatusMessage)"
            exit 1
          }
          if ($null -eq $sig.TimeStamperCertificate) {
            Write-Error "al-runner.exe has no RFC 3161 timestamp"
            exit 1
          }
          & $env:SIGN_EXE --version
          if ($LASTEXITCODE -ne 0) { Write-Error "The signed al-runner.exe does not run"; exit 1 }
      - name: Package
        shell: bash
        run: |
          name="al-runner-${{ inputs.label }}-${{ matrix.target }}"
          mkdir -p stage dist
          if [ "${{ matrix.ext }}" = zip ]; then
            cp "target/${{ matrix.target }}/release/al-runner.exe" stage/
          else
            cp "target/${{ matrix.target }}/release/al-runner" stage/
          fi
          cp LICENSE stage/LICENSE
          cp release/README.txt stage/README.txt
          if [ "${{ matrix.ext }}" = zip ]; then
            (cd stage && 7z a -tzip "../dist/$name.zip" . > /dev/null)
          else
            tar -C stage -cJf "dist/$name.tar.xz" .
          fi
          ls -l dist
      - name: Attest build provenance
        if: inputs.attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          submodules: false
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS and install scripts
        run: |
          cp release/install.sh release/install.ps1 dist/
          (cd dist && sha256sum al-runner-*.tar.xz al-runner-*.zip > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*
          if-no-files-found: error
