name: CI

# Every push and PR: lint, unit + contract tests, then the corpus pass-rate report. The daily
# schedule produces one report per day even without pushes, which gives the pass-rate curve (one
# `pass-rate-<date>` artifact per day).
#
# Three jobs run in parallel, each on its own runner, so the wall time is that of the slowest one:
#
#   test           format, clippy, and every test that runs in a plain debug `cargo test`
#   corpus         release build, the corpus pass rate for every BC version, and the demand-driven
#                  compile against the eager compile (the normal run first and alone, then the three eager runs side by side),
#                  then `dev_tooling` against the same release build
#   release-tests  the rest of what needs an optimised build: the perf budgets, `corpus_harness` (runs the
#                  finished `al-test-cli` over the whole corpus), `must_not_compile`, the network tests and the
#                  affected selection differential
#
# Owner amendment, 2026-10-31: the four comparisons that cost runner time and have not failed on a pull request
# since they were added run on a push to main, on the nightly schedule and on manual dispatch, not on a pull request.
# They are: the demand-driven compile against the eager compile, the compile cache against the uncached run, the
# install baseline rule against the normal run, and the release-only perf budgets. The jobs keep their names (they
# are required checks of the main ruleset); on a pull request the steps are skipped and a step says why.
#
# Owner decision, 2026-11-04 (a push to main went from about 42 to about 7 runner-minutes):
#   - Nightly set. Those four comparisons, the compile cache steps and the affected selection differential run
#     only on the nightly schedule, on manual dispatch and when release-tag.yml calls this workflow
#     (env NIGHTLY_SET below). Not on a pull request, a push to main or a push to a corpus-bump/** branch.
#   - A push to main that comes from a merged pull request skips `test`, `licenses`, `portable` and
#     `release-tests`, but only when the job `merge-check` proves the pull request already tested exactly this
#     tree: the newest successful pull_request run of the pull request's head commit uploaded the artifact
#     `tested-tree` (the tree of the merge commit it checked out), and that tree equals the tree of the new main
#     commit. The ruleset's "branch must be up to date" policy makes them equal, but the workflow does not rely on
#     it: after an admin bypass, a rule change, a merge that was not up to date, or a direct push (no merged
#     pull request), the trees differ or nothing is found, and the full pull request set runs. When the check
#     itself fails, the full set runs too. The `corpus` job always runs: it checks the not-passing lists (ADR-065) and
#     uploads the coverage maps.
#   - Required checks apply to pull requests only. On a pull request `test`, `licenses`, `portable` and `corpus` run in
#     full (owner rule: no path filter or selection on `corpus` or `test`), with one exception, below.
#
# Owner decision, 2026-11-12: a change of markdown files only runs no pipeline.
#   - Pull request. The job `docs-check` prints `docs_only=true` only when the list of changed files was read in full and
#     every file ends in `.md` and is none of the markdown files a test or tool reads (the list is in that job). Then
#     `test`, `licenses`, `portable`, `corpus` and `release-tests` are skipped by their `if`. A job skipped by its `if`
#     reports success, so the required checks pass (no stub jobs, for the reason given under `release-tests` below).
#     The job `legal guard` runs instead: `tools/legal_guard.sh` checks every tracked file for a licensing claim, a
#     Microsoft header or a decompiler marker, which the `test` job would otherwise catch. This holds for a draft too.
#   - Push. The `paths` filter of the push trigger leaves out every `.md` file except the same list, so a push (a merge to
#     main included) that changes only other markdown files starts no run. The schedule, manual dispatch and
#     release-tag.yml (workflow_call) have no path filter and run everything.
#   - Keep the list in `docs-check` and the push `paths` the same.
#   - `release-tests` on a pull request runs unless the job `release-tests-paths` proves that every changed file is
#     outside what it checks (the rule is in that job; when in doubt it runs). A job skipped by its `if` reports
#     success, so the required check `release-tests` still passes; no stub job with the same name is added, because two
#     check runs with one name would let a skipped one stand in for a failed one. Nightly, manual dispatch and
#     release-tag.yml always run it.
#
# Nothing is dropped by the split. The two test files that run the `al-test-cli` binary over the
# whole pinned corpus (`corpus_harness`, `dev_tooling`) are gated behind the `cli-e2e` feature of
# al-test-cli, which is on by default (so `cargo test` and `check.sh` still run them). The `test` job
# builds with `--no-default-features`, because the unoptimised binary needs minutes for them, and the
# `corpus` and `release-tests` jobs run them with the release binary.

on:
  push:
    # corpus-bump/**: the corpus bump bot (.github/workflows/corpus-bump-bot.yml) opens its pull request with the
    # workflow token, which starts no pull_request run; the push of its branch (deploy key) runs CI instead.
    branches: [main, release, 'corpus-bump/**']
    # A push that changes only markdown files starts no run (owner, 2026-11-12; see the header). Keep the re-included
    # files the same as the list in the job `docs-check`: tests and tools read them.
    paths:
      - '**'
      - '!**.md'
      - 'README.md'
      - 'oracle/README.md'
      - 'docs/codemap.md'
      - 'docs/probes-needed.md'
      - 'docs/corpus-coverage.*'
      - 'docs/corpus-behavior-coverage.*'
      - 'crates/**.md'
      - 'tools/**.md'
      - '.github/**.md'
  # ready_for_review: a draft pull request runs only the job `test` (see `jobs` below); marking it ready starts the full set.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # 00:17 UTC: the nightly run (with the nightly set) ends before nightly-edge.yml (02:17 UTC), which advances
  # `release` only to a commit whose scheduled run passed (owner, 2026-11-04; it was 05:17 before).
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  # release-tag.yml runs the same checks before it builds a numbered alpha, the nightly set included. A called
  # workflow sees the caller's event name, so the input (always true when called) is how it knows.
  workflow_call:
    inputs:
      release_check:
        type: boolean
        default: true

# Read-only token for every job; cache-cleanup asks for actions: write on its own. No job here writes
# to the repository, and no workflow pushes to main (ADR-065).
permissions:
  contents: read

env:
  # The built sidecar, for the sidecar tests and the corpus run. A missing .NET fails, not skips.
  ALRT_DOTNET_SIDECAR: ${{ github.workspace }}/target/dotnet-sidecar/AlDotNetSidecar.dll
  ALRT_REQUIRE_DOTNET: "1"
  # 'true' when the nightly set runs (see the header): the nightly schedule, manual dispatch, release-tag.yml.
  NIGHTLY_SET: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.release_check == true }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Owner, 2026-11-01: a draft pull request runs no job; owner, 2026-11-10: it runs the job `test` again (about 8 minutes)
# and no other. Agents open their feature pull requests as drafts (a merge
# train lands them, and its own pull request runs CI); the free plan allows 20 Linux jobs at once for the whole
# organisation. Every job below except `test` has `if: github.event.pull_request.draft != true`, which is true on every other
# event. A skipped job counts as passed for the ruleset, and a draft cannot merge anyway.
#
# The jobs `test`, `licenses`, `portable` and `release-tests` wait for `merge-check` and run unless it says the pull
# request already tested this tree (header, owner decision 2026-11-04). `merge-check` runs only on a push to main;
# elsewhere it is skipped, and `!cancelled()` lets the jobs run after a skipped or failed `merge-check`.
#
# The jobs `test`, `licenses`, `portable`, `corpus` and `release-tests` also wait for `docs-check` and are skipped when
# it prints `docs_only=true` (header, owner decision 2026-11-12). It runs only on a pull request, drafts included; on
# every other event it is skipped, its output is empty and the jobs run.
jobs:
  merge-check:
    name: merge push check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      # Writes skip=true only when every link holds; any error or mismatch leaves it unset, and the full set runs.
      - name: Did the merged pull request test this exact tree?
        id: check
        continue-on-error: true
        run: |
          note() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          main_tree=$(gh api "repos/$GH_REPO/git/commits/$SHA" --jq .tree.sha)
          # The pull request whose merge made this commit. The API can lag a few seconds behind the merge.
          pr=""
          for attempt in 1 2 3; do
            pr=$(gh api "repos/$GH_REPO/commits/$SHA/pulls" \
              --jq "[.[] | select(.merged_at != null and .merge_commit_sha == \"$SHA\")][0] | select(. != null) | \"\(.number) \(.head.sha)\"")
            [ -n "$pr" ] && break
            sleep 10
          done
          if [ -z "$pr" ]; then
            note "No merged pull request made $SHA (a direct push). The full set runs."
            exit 0
          fi
          read -r number head <<<"$pr"
          # The newest successful pull_request run of the head commit that uploaded its tested tree. A run on a
          # draft ran only the job `test`: it uploads no artifact (see `test`) and is passed over.
          runs=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$head&status=success&per_page=10" \
            --jq '.workflow_runs[].id')
          for run in $runs; do
            dir=$(mktemp -d)
            if gh run download "$run" --name tested-tree --dir "$dir" 2>/dev/null; then
              tested=$(cat "$dir/tree.txt")
              if [ "$tested" = "$main_tree" ]; then
                note "Pull request #$number tested tree $tested in run $run; main commit $SHA has the same tree. The jobs it ran are skipped."
                echo "skip=true" >> "$GITHUB_OUTPUT"
              else
                note "Pull request #$number tested tree $tested in run $run, but main commit $SHA has tree $main_tree. The full set runs."
              fi
              exit 0
            fi
          done
          note "Pull request #$number has no successful run with a tested tree for head $head. The full set runs."

  # Decides whether the pull request changes markdown files only (owner decision 2026-11-12, see the header). It prints
  # `docs_only=true` only when the list of changed files was read in full and every file, and the old name of every
  # renamed file, ends in `.md` and is none of these, which a test or tool reads:
  #   README.md                        crates/alrunner-cli/tests/legal_text.rs
  #   oracle/README.md                 tools/corpus_bump_pr.py and its tests (suite/corpus_bump_from_pr.rs)
  #   docs/codemap.md                  suite/codemap.rs
  #   docs/probes-needed.md            al-builtins assumptions.rs tests, suite/refusal_keys.rs, `--assumptions-doc`
  #   docs/corpus-coverage.*, docs/corpus-behavior-coverage.*   written by al-test-cli (not committed)
  #   crates/**, tools/**, .github/**  suite/no_microsoft_source_in_repo.rs reads every tracked file there
  # The push `paths` filter (`on:` above) re-includes the same files. A failed API call, or a pull request with 3,000
  # files or more (the API's limit), leaves the output unset, and every job runs.
  docs-check:
    name: docs-only check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.paths.outputs.docs_only }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Does the pull request change markdown files only?
        id: paths
        continue-on-error: true
        run: |
          # The old name of a renamed file counts as changed too: a .rs file renamed to .md removes the .rs file.
          files=$(gh api --paginate "repos/$GH_REPO/pulls/$PR/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)')
          count=$(printf '%s\n' "$files" | grep -c . || true)
          if [ "$count" -eq 0 ] || [ "$count" -ge 3000 ]; then
            echo "Every job runs: $count changed files read." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          while IFS= read -r f; do
            case "$f" in
              README.md|oracle/README.md|docs/codemap.md|docs/probes-needed.md) ;;
              docs/corpus-coverage.*|docs/corpus-behavior-coverage.*) ;;
              crates/*|tools/*|.github/*) ;;
              *.md) continue ;;
            esac
            echo "Every job runs: $f is not a markdown file, or a test or tool reads it." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          done <<<"$files"
          echo "Markdown only: none of the $count changed files is read by a test or tool. Only the legal guard runs." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "docs_only=true" >> "$GITHUB_OUTPUT"

  # A markdown-only pull request skips `test`, which runs suite/legal_guard.rs and suite/no_microsoft_source_in_repo.rs
  # over the repository. This job runs the same script on the checked-out merge commit, without cargo.
  legal-guard:
    name: legal guard
    needs: docs-check
    if: needs.docs-check.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/legal_guard.sh .

  # Decides whether `release-tests` runs on a pull request (owner decision 2026-11-04). It prints `run=false` only when
  # the list of changed files was read in full and every file is in one of these places:
  #   docs/**             except docs/corpus-coverage.*, docs/corpus-behavior-coverage.*, docs/probes-needed.md and
  #                       docs/language-catalog.json (read or compiled in by al-test-cli and its tests)
  #   tools/**            except tools/run_test_binaries.sh and tools/dotnet-sidecar/** (the corpus runs use the sidecar)
  #   packaging/**, release/**
  #   a top-level file    except the corpus submodule pin, Cargo.toml, Cargo.lock, .gitmodules and rust-toolchain*
  # Everything else runs it: the corpus submodule pin, oracle/, metrics/, crates/ (the golden files, the harness and every
  # crate al-test-cli compiles), .github/, .cargo/ and any new top-level folder. A failed API call, or a pull request with
  # 3,000 files or more (the API's limit), leaves the output unset, and release-tests runs.
  release-tests-paths:
    name: release-tests paths
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.paths.outputs.run }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Does the pull request touch what release-tests checks?
        id: paths
        continue-on-error: true
        run: |
          # The old name of a renamed file counts too (a file moved out of crates/ changes crates/).
          files=$(gh api --paginate "repos/$GH_REPO/pulls/$PR/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)')
          count=$(printf '%s\n' "$files" | grep -c . || true)
          if [ "$count" -eq 0 ] || [ "$count" -ge 3000 ]; then
            echo "release-tests runs: $count changed files read." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          while IFS= read -r f; do
            case "$f" in
              docs/corpus-coverage.*|docs/corpus-behavior-coverage.*|docs/probes-needed.md|docs/language-catalog.json) ;;
              tools/run_test_binaries.sh|tools/dotnet-sidecar/*) ;;
              docs/*|tools/*|packaging/*|release/*) continue ;;
              corpus|Cargo.toml|Cargo.lock|.gitmodules|rust-toolchain*) ;;
              */*) ;;
              *) continue ;;
            esac
            echo "release-tests runs: $f is a path it checks." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          done <<<"$files"
          echo "release-tests skipped: none of the $count changed files is a path it checks." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "run=false" >> "$GITHUB_OUTPUT"

  test:
    needs: [merge-check, docs-check]
    # No draft condition (owner, 2026-11-10): `test` runs on a draft pull request too.
    if: ${{ !cancelled() && needs.merge-check.outputs.skip != 'true' && needs.docs-check.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    env:
      # Line tables are enough for a panic's location; full debug info made the debug test build
      # about a third slower and the dependency cache four times larger.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          components: rustfmt, clippy
      # The tree this pull request run tests (the merge commit checked out). The job merge-check of the push to main
      # compares it with the tree of the new main commit (header, owner decision 2026-11-04). Not on a draft: a draft
      # runs only this job, so its run did not test the tree with the full set and must not let main skip that set.
      - name: Record the tested tree
        if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
        run: |
          mkdir -p "$RUNNER_TEMP/tested-tree"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/tested-tree/tree.txt"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
        with:
          name: tested-tree
          path: ${{ runner.temp }}/tested-tree/tree.txt
          retention-days: 14
      - run: cargo fmt --all --check
      # Default features: clippy also lints the two corpus-wide test files.
      - run: cargo clippy --all-targets -- -D warnings
      # Tests that read a Microsoft file (the platform's System.app, for one) take it from the pinned build in the
      # artifact cache and never download (crates/al-testfiles, ADR-013 amendment of 2026-11-10): a missing file fails
      # them. They read the build of BC 27 only. The binary is built the way the test step builds it (the workspace's
      # features, without the default ones), so that step does not compile it again.
      - name: Build the debug binary
        run: cargo build --workspace --no-default-features --bin al-test-cli
      - name: Microsoft apps of the pinned BC 27 build
        uses: ./.github/actions/bc-artifacts
        with:
          binary: ./target/debug/al-test-cli
          versions: --bc-version 27
      # Without the cli-e2e feature: `dev_tooling` runs in the corpus job and `corpus_harness` in the release-tests job.
      # The test binaries run side by side, at most one per core (`cargo test` ran them one after the other).
      # `must_not_compile` runs in release in the release-tests job: in debug it alone took 92 s.
      - name: Tests (debug, binaries side by side)
        run: |
          tools/run_test_binaries.sh --workspace --no-default-features -- \
            --all --except al-test-cli:must_not_compile
      - name: Doc tests
        run: cargo test --workspace --no-default-features --doc

  # Fails when a dependency has a license that is not on the allow-list in deny.toml.
  licenses:
    needs: [merge-check, docs-check]
    if: ${{ !cancelled() && github.event.pull_request.draft != true && needs.merge-check.outputs.skip != 'true' && needs.docs-check.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      # The prebuilt cargo-deny release binary with a checksum check. It replaced EmbarkStudios/cargo-deny-action, whose
      # container image build failed now and then. 0.19.8 is the version that action (v2.0.20) installed.
      - name: Install cargo-deny 0.19.8
        env:
          DENY_VERSION: 0.19.8
          DENY_SHA256: 70e769ae3872e34d45132b17040859175e11401dc12dddb0303e0b8c7d088f3f
        run: |
          set -euo pipefail
          name="cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location --retry 3 -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/$name.tar.gz"
          echo "${DENY_SHA256}  $RUNNER_TEMP/$name.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/$name/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
      # The same command the action ran: its default arguments plus `check licenses`, with deny.toml.
      - run: cargo-deny --log-level warn --manifest-path ./Cargo.toml --all-features check licenses

  # The release builds macOS and Windows binaries. A compile error that only those targets show
  # (a Unix-only call, a missing OS function) must fail the push, not the release. Check only: no
  # link, no tests. Test code of the workspace is not checked on Windows. macOS left the matrix on
  # 2026-11-04 (owner; it is no longer a required check): the nightly edge build of aarch64-apple-darwin
  # finds a macOS-only compile error.
  portable:
    name: portable check (${{ matrix.os }})
    needs: [merge-check, docs-check]
    if: ${{ !cancelled() && github.event.pull_request.draft != true && needs.merge-check.outputs.skip != 'true' && needs.docs-check.outputs.docs_only != 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --locked --workspace

  corpus:
    # `!cancelled()`: a skipped `docs-check` (every event but a pull request) must not skip this job.
    needs: docs-check
    if: ${{ !cancelled() && github.event.pull_request.draft != true && needs.docs-check.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    # actions: read lets the step time guard read main's earlier runs of this job (tools/step_time_guard.py).
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup

      # One release build serves the corpus runs below. rust-cache keeps dependencies only.
      - name: Build release binary
        run: cargo build --release -p al-test-cli

      # ADR-013 Layer A: every Microsoft app the corpus runs on comes from the pinned builds in the artifact cache
      # (.github/actions/bc-artifacts fills it; the corpus tree holds none).
      - name: Fetch dependency apps (Microsoft apps of the pinned builds; warms the cache)
        id: bc
        uses: ./.github/actions/bc-artifacts

      # ADR-022. The compile cache holds the lowered form of the dependency apps, made on this
      # runner from the downloaded apps; it is saved with actions/cache and never uploaded
      # anywhere else. The key names the BC builds (the apps) and the sources of the runtime (the
      # entry file's own key also holds a hash of the executable, so a build that differs misses
      # and rebuilds). No restore-keys: an entry of another build is never usable.
      - name: Compile cache, restore
        if: env.NIGHTLY_SET == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/al-runtime/compile
          key: compile-cache-${{ steps.bc.outputs.key }}-${{ hashFiles('Cargo.lock', 'crates/**/*.rs') }}
      # Builds the entry of each version when it is not there, or reads and checks every block of
      # the one that is. The measured run below is then always a cache hit, and the time of the
      # build is reported on its own line.
      - name: Compile cache, build or verify
        if: env.NIGHTLY_SET == 'true'
        run: |
          ./target/release/al-test-cli --all-versions --build-compile-cache | tee cache-build.txt

      # The corpus pass rate fails the job when a not-passing list of a version in oracle/oracle.toml does not hold
      # (ADR-065, exit 1): a case not listed in metrics/<major>/not-passing*.txt does not pass (a regression), a listed
      # case passes or left the oracle (a stale line: `al-test-cli --prune-not-passing` deletes it), or an oracle case
      # got no outcome. Exit 2 when the oracle and the corpus pin disagree.
      #
      # ADR-013 decision 6: the demand-driven compile of the dependency apps must never change an
      # outcome. The corpus runs a second time with every dependency routine compiled
      # (`AL_EAGER_DEPENDENCIES=1`), and no test may come out differently (pass, fail or not run).
      # A test the demand-driven compile refuses and the eager one runs shows up here as well:
      # that is a path BC runs and the demand-driven compile did not reach. `tools/demand_vs_eager.sh`
      # compares the main app and every extra suite and prints each difference with both reasons;
      # locally, `tools/demand_vs_eager.sh run` makes the runs and the comparison.
      #
      # The normal run (all versions, one process: it prints the comparison across versions) goes
      # first and alone, so the times in its "How long it took" tables are the runtime's own, not
      # slowed by other runs. Then one eager run per version goes side by side (a corpus run uses
      # one core, the runner has four). The runs share no files (the dependency cache is only read
      # after the step above) and each stays well under 3 GB.
      #
      # The normal run is also the work ratchet (docs/architecture.md, "Work ratchet and step time guard"): al-test-cli compares what each
      # pass compiled and ran (routines lowered, objects loaded, dependency apps from source or from the cache, install
      # baseline rows, tests run) with metrics/<major>/work.json and exits 1 when a count is more than 10% above it.
      - name: Corpus pass rate, and the demand-driven compile against the eager compile
        id: corpus_step
        run: |
          step_start=$(date +%s)
          status=0
          # Its output also goes to normal.log, which the comparison of the passes below and the job summary read
          # (ADR-063; the failures of the not-passing lists, ADR-065).
          ./target/release/al-test-cli --all-versions --require-dotnet \
            --json pass-rate.json --markdown pass-rate.md --junit runtime-junit.xml 2>&1 | tee normal.log
          [ "${PIPESTATUS[0]}" -eq 0 ] || status=1
          normal_end=$(date +%s)
          # The job summary is written by the step "Corpus job summary" below, from the files the
          # runs write (pass-rate-<v>.md and .json, eager-summary.md).

          eager_end=$normal_end
          eager_reports=()
          # Owner decision, 2026-11-04: the eager and fresh comparisons are in the nightly set (see the header).
          if [ "$NIGHTLY_SET" = true ]; then
            # --no-ratchet: the allow-listed differences fail the ratchet; compare_junit is the check.
            # --json keeps each eager run's phase times (every report has them).
            eager_pids=()
            for v in 27 28 29; do
              AL_EAGER_DEPENDENCIES=1 ./target/release/al-test-cli --bc-version $v --require-dotnet --no-ratchet \
                --junit eager-junit-$v.xml --json eager-report-$v.json > eager-$v.log 2>&1 &
              eager_pids+=($!)
            done
            i=0
            eager_reports=()
            for v in 27 28 29; do
              wait "${eager_pids[$i]}" || { echo "::error::the eager run for BC $v failed"; status=1; }
              i=$((i + 1))
              echo "::group::Eager run output, BC $v"
              cat eager-$v.log
              echo "::endgroup::"
              if [ -f eager-report-$v.json ]; then
                eager_reports+=(--timings-table eager-report-$v.json)
              fi
            done
            eager_end=$(date +%s)
            # The main app of each version and every extra suite (OnPrem, the isolation probes).
            tools/demand_vs_eager.sh compare . || status=1
            # Nightly set only, like the eager comparison: it is three more full corpus runs.
            # ADR-063: a pass after the main one grows the main pass's compile by its own apps. One run per version that
            # compiles every pass from source (AL_FRESH_PASS_COMPILE=1) must report the same outcomes, reasons and install
            # baselines as the normal run. The three runs go side by side; each stays under 3 GB.
            fresh_pids=()
            for v in 27 28 29; do
              AL_FRESH_PASS_COMPILE=1 ./target/release/al-test-cli --bc-version $v --require-dotnet --no-ratchet \
                --junit fresh-junit-$v.xml > fresh-$v.log 2>&1 &
              fresh_pids+=($!)
            done
            i=0
            for v in 27 28 29; do
              wait "${fresh_pids[$i]}" || { echo "::error::the run that compiles every pass from source failed for BC $v"; status=1; }
              i=$((i + 1))
            done
            tools/fresh_vs_grown.sh compare . || status=1
          fi
          step_end=$(date +%s)

          {
            echo
            echo "## How the time of this step adds up"
            echo
            echo "- The normal run of all versions, alone on the runner: $((normal_end - step_start)) s."
            echo "- The three runs that compile every dependency, side by side: $((eager_end - normal_end)) s."
            echo "- The comparison of the two, and the three runs that compile every pass from source with theirs: $((step_end - eager_end)) s."
            echo "- The step in total: $((step_end - step_start)) s."
            echo
            echo "The times without the compile cache are from the normal run, which had the runner to itself."
            if [ ${#eager_reports[@]} -gt 0 ]; then
              echo
              echo "The runs that compile every dependency (three at a time on 4 vCPUs):"
              echo
              ./target/release/al-test-cli "${eager_reports[@]}"
            fi
          } | tee eager-summary.md
          # The step time guard compares the normal run only: a push to main runs nothing else in this step since
          # 2026-11-04, so main's earlier times of the step are times of the normal run.
          echo "seconds=$((normal_end - step_start))" >> "$GITHUB_OUTPUT"
          exit $status

      # The loose guard (docs/architecture.md, "Work ratchet and step time guard"): the step above fails the job when its normal
      # run took more than 1.5 times the median of the same step in main's last 10 successful push runs; with fewer than 5 it
      # only notes it.
      - name: Corpus step time, against main's last runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/step_time_guard.py "${{ steps.corpus_step.outputs.seconds }}" \
            --step "Corpus pass rate, and the demand-driven compile against the eager compile"

      # The developer-tool tests that run `al-test-cli` over the corpus (about 1 min), against the release binary built
      # above. In the release-tests job they made it end 2 to 3 minutes after this one; here they reuse the release
      # build. The `test` job leaves them out (see the header).
      - name: CLI end-to-end test (dev_tooling)
        run: cargo test --release --no-fail-fast -p al-test-cli --test dev_tooling

      # ADR-022. The measured run: every dependency app comes from the compile cache
      # (`--require-compile-cache` turns a miss into an error). Its outcomes must be those of the
      # normal run above for every test, with no exception (owner decision of 2026-10-14; the
      # list tools/demand-eager-known-differences.txt is empty). The job summary has the times
      # with the cache on; the time to build the cache is a line of its own.
      - name: Corpus with the compile cache, against the uncached run
        if: env.NIGHTLY_SET == 'true'
        run: |
          status=0
          ./target/release/al-test-cli --all-versions --require-dotnet --no-ratchet --require-compile-cache \
            --json cached-pass-rate.json --markdown cached-pass-rate.md --junit cached-junit.xml || status=1
          # ADR-054: the same with every cached object decoded at start; it must equal the lazy decode.
          ALRUNNER_EAGER_DECODE=1 ./target/release/al-test-cli --all-versions --require-dotnet --no-ratchet \
            --require-compile-cache --junit eagerdecode-junit.xml > /dev/null || status=1
          tools/cache_vs_uncached.sh compare . || status=1
          exit $status

      # The job summary, from the files the two steps above write. It runs even when one of them
      # failed, so a regression still shows its numbers.
      - name: Comparisons that run nightly only
        if: env.NIGHTLY_SET != 'true'
        run: |
          {
            echo "## Comparisons that run nightly only"
            echo
            echo "Owner decision, 2026-11-04: the demand-driven against eager compile, the runs that compile every pass from source, the compile cache against the uncached run, the install baseline rule, the perf budgets and the affected selection differential run on the nightly schedule, on manual dispatch and before a numbered release. Not on a pull request or a push."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # ADR-065, owner decision 2: how this pull request changes the not-passing lists against the base branch. A line
      # for a case the base oracle already had is a regression the owner approves in review: listed in the job summary
      # with a warning, not a failure (the run above already fails while such a case is neither passing nor listed).
      - name: Not-passing lists against the base branch
        if: always() && github.event_name == 'pull_request'
        run: |
          git fetch -q --no-tags --depth=1 origin "${{ github.base_ref }}"
          status=0
          ./target/release/al-test-cli --root . --list-changes FETCH_HEAD > list-changes.md || status=$?
          sed -i "1s|FETCH_HEAD|${{ github.base_ref }}|" list-changes.md
          cat list-changes.md
          if [ "$status" = 1 ]; then
            echo "::warning::this pull request adds a not-passing line for a case the base oracle had (a regression); it needs the owner's OK"
          elif [ "$status" != 0 ]; then
            echo "::error::al-test-cli --list-changes failed"
            exit 1
          fi
      - name: Corpus job summary
        if: always()
        run: |
          # The "How long it took" table of each report of one run; nothing when there is none.
          timings() {
            local args=() f
            for f in "$1"-*.json; do
              [ -f "$f" ] && args+=(--timings-table "$f")
            done
            if [ ${#args[@]} -gt 0 ]; then
              ./target/release/al-test-cli "${args[@]}" || true
            else
              echo "No report."
            fi
          }
          {
            # ADR-065: what the run says about the not-passing lists (regressions, stale lines, cases without an
            # outcome), from its log.
            echo "## Not-passing lists"
            echo
            if grep -qE "^BC [^:]+: [0-9]+ (regression\(s\)|stale line\(s\)|oracle case\(s\) got no outcome)" normal.log 2>/dev/null; then
              echo '```'
              awk '/^BC [^:]+: [0-9]+ (regression\(s\)|stale line\(s\)|oracle case\(s\) got no outcome)/ {on=1; print; next}
                   on && /^  / {print; next} {on=0}' normal.log | head -n 400
              echo '```'
            else
              echo "Every list holds: no regression, no stale line, every oracle case has an outcome."
            fi
            echo
            if [ -f list-changes.md ]; then
              cat list-changes.md
              echo
            fi
            echo "## Corpus pass rate and time"
            echo
            echo "Pass, fail and not run are from the normal run. The times are the total of each run."
            echo
            python3 - <<'PY'
          import json, os
          def load(p):
              try:
                  with open(p) as f:
                      return json.load(f)
              except (OSError, ValueError):
                  return None
          def secs(d):
              t = (d or {}).get("timings") or {}
              return t.get("total_s")
          print("| Version | Passed | Failed | Not run | Without the compile cache | With the compile cache | Difference |")
          print("|---|---:|---:|---:|---:|---:|---:|")
          for v in ("27", "28", "29"):
              n = load(f"pass-rate-{v}.json")
              c = load(f"cached-pass-rate-{v}.json")
              if n is None and c is None:
                  continue
              o = (n or c)["overall"]
              a, b = secs(n), secs(c)
              fa = f"{a:.1f} s" if a is not None else "-"
              fb = f"{b:.1f} s" if b is not None else "-"
              fd = f"{b - a:+.1f} s" if a is not None and b is not None else "-"
              label = ((n or c).get("timings") or {}).get("bc_version") or v
              print(f"| BC {label} | {o['pass']} | {o['fail']} | {o['not_run']} | {fa} | {fb} | {fd} |")
          # The work counts of the normal run, the totals of each version (metrics/<major>/work.json holds the expected).
          rows = {v: (load(f"pass-rate-{v}.json") or {}).get("work") or {} for v in ("27", "28", "29")}
          if any(rows.values()):
              print()
              print("Work counts of the normal run, every pass of a version added up (the work ratchet):")
              print()
              names = sorted({k for w in rows.values() for c in w.values() for k in c})
              print("| Counter | " + " | ".join(f"BC {v}" for v in rows) + " |")
              print("|---|" + "---:|" * len(rows))
              for k in names:
                  cells = [str(sum(c.get(k, 0) for c in w.values())) for w in rows.values()]
                  print(f"| {k} | " + " | ".join(cells) + " |")
          PY
            echo
            echo "## Without the compile cache (demand-driven compile)"
            echo
            cat pass-rate-*.md 2>/dev/null || echo "No report: the run did not finish."
            echo
            echo "How long it took:"
            echo
            timings pass-rate
            echo
            echo "## With the compile cache"
            echo
            echo "Every dependency app taken from the cache."
            echo
            cat cached-pass-rate-*.md 2>/dev/null || echo "No report: the run did not finish."
            echo
            echo "How long it took:"
            echo
            timings cached-pass-rate
            echo
            echo "### Time to build the compile cache (not part of the times above)"
            echo
            grep "^compile cache build time" cache-build.txt | sed 's/^/- /' || true
            grep "^compile cache: BC" cache-build.txt | sed 's/^/- /' || true
            echo
            echo "<details><summary>Check run: every dependency compiled (a correctness check, not a speed measurement)</summary>"
            echo
            echo "These runs only prove that the demand-driven compile skips nothing a test needs."
            echo
            cat eager-summary.md 2>/dev/null || echo "No report: the check did not finish."
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      # ADR-013, "The baseline runs only when a selected test can observe it": the rule that skips the
      # install baseline must never change an outcome. This run starts every test codeunit the rule
      # calls free of the baseline on an empty store; no test may come out differently.
      - name: Install baseline rule, against the normal run
        if: env.NIGHTLY_SET == 'true'
        run: |
          status=0
          AL_CHECK_BASELINE_RULE=1 ./target/release/al-test-cli --all-versions --require-dotnet --no-ratchet \
            --junit ruled-junit.xml > ruled.log 2>&1 || status=1
          tools/baseline_rule_check.sh compare . || status=1
          exit $status
      # Keeps the entries this run used and drops the rest, so the cache that is saved at the end of
      # the job holds only what the next run can use.
      - name: Compile cache, prune
        if: env.NIGHTLY_SET == 'true'
        run: |
          used=$(grep -o '[^ ]*deps-[0-9a-f]*\.alcc' cache-build.txt | sort -u)
          for f in ~/.cache/al-runtime/compile/*.alcc; do
            [ -e "$f" ] || continue
            echo "$used" | grep -qx "$f" || { echo "pruned $f"; rm -f "$f"; }
          done

      # ADR-065, owner decision 3: the coverage maps are not committed. Each run on main uploads them (static, seconds).
      - name: Coverage maps
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p "$RUNNER_TEMP/coverage-maps"
          ./target/release/al-test-cli --root . --coverage-map "$RUNNER_TEMP/coverage-maps"
          ./target/release/al-test-cli --root . --behavior-coverage-map "$RUNNER_TEMP/coverage-maps"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: coverage-maps-${{ github.run_id }}
          path: ${{ runner.temp }}/coverage-maps/
          retention-days: 90

      - name: Date stamp
        if: always()
        id: date
        run: echo "d=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pass-rate-${{ steps.date.outputs.d }}-${{ github.run_id }}
          path: |
            pass-rate-*.json
            pass-rate-*.md
            runtime-junit-*.xml
            eager-junit-*.xml
            eager-report-*.json
            cached-pass-rate-*.json
            cached-pass-rate-*.md
            cached-junit-*.xml
            ruled-junit-*.xml
          retention-days: 90

  release-tests:
    needs: [merge-check, docs-check, release-tests-paths]
    if: ${{ !cancelled() && github.event.pull_request.draft != true && needs.merge-check.outputs.skip != 'true' && needs.docs-check.outputs.docs_only != 'true' && needs.release-tests-paths.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup

      # corpus_resolve_deps, platform_tables and the perf budgets read Microsoft's apps of the pinned builds from the
      # artifact cache and never download (ADR-013 amendment of 2026-11-10). The release binary is the one
      # corpus_harness needs below, so the build is not extra work.
      - name: Build release binary
        run: cargo build --release -p al-test-cli
      - name: Microsoft apps of the pinned builds
        uses: ./.github/actions/bc-artifacts

      # Budgets (issue #1): the cold compile of the corpus in instructions per object (wall time is printed only: a shared runner
      # varies by 20 % from day to day), parser throughput at
      # least 50 MB/s, and the VM budget (ADR-031: instructions per iteration of the tests/vm-bench programs; where the runner
      # allows no hardware counter it falls back to CPU time with wider limits). #[ignore]d in plain `cargo test` because they only mean something in release.
      # This job runs nothing else at the same time, so the numbers are not disturbed.
      # CI has no instruction counter, so the CPU-time fallback only warns here (owner, 2026-10-20); with a counter the budgets fail.
      # Owner decision, 2026-11-04: the budgets are in the nightly set (see the header); they ran on a push to main
      # since 2026-10-31. The two checks that are not budgets (corpus_resolve_deps, platform_tables) stay on every
      # pull request.
      - name: Perf budgets
        if: env.NIGHTLY_SET == 'true'
        run: |
          cargo test --release --no-fail-fast \
            -p al-syntax --test perf_parse_throughput \
            -p al-test-cli --test perf_budget \
            -p al-test-cli --test perf_vm \
            -p al-data --lib \
            -- --ignored --nocapture
      # Four groups of release tests, side by side (tools/run_test_binaries.sh builds them in one cargo call, then
      # starts every binary at once; `cargo test` ran one after the other):
      #   corpus_resolve_deps, platform_tables  the ignored release checks that are not budgets.
      #   corpus_harness                        runs `al-test-cli` over the whole pinned corpus and its oracle
      #                                         (`--no-deps`), against the release binary. The `test` job leaves it out
      #                                         (see the header); `dev_tooling` runs in the corpus job. Its tests share
      #                                         one corpus run through a static, so it keeps one process per binary.
      #   must_not_compile                      every must-not-compile case of the corpus gets its ALnnnn codes (92 s
      #                                         in the debug build of the test job, which leaves it out).
      #   network, network_deps                 the only tests that use the network: Microsoft's artifact feed, read
      #                                         by range. They use fresh cache directories, so they check the
      #                                         protocol and the real archives, not a cache.
      - name: Release tests (corpus_resolve_deps, platform_tables, corpus_harness, must_not_compile, network)
        run: |
          tools/run_test_binaries.sh --release -- \
            "al-test-cli:corpus_resolve_deps:--ignored --nocapture" \
            "al-test-cli:platform_tables:--ignored --nocapture" \
            al-test-cli:corpus_harness \
            al-test-cli:must_not_compile \
            "al-deps:network:--ignored --nocapture" \
            "al-test-cli:network_deps:--ignored --nocapture"

      # ADR-050 decision 12: edits of the corpus app; per edit the --affected selection plus the stored outcomes of the
      # skipped codeunits must equal a full run (about 5 s per run, two runs per narrowed edit).
      # Runner time is scarce: the differential is in the nightly set (owner, 2026-11-04; it was the longest step of a
      # push to main, about 9.6 min).
      - name: Affected selection differential
        if: env.NIGHTLY_SET == 'true'
        run: |
          cargo test --release --no-fail-fast \
            -p al-test-cli --test affected_differential \
            -- --ignored --nocapture

  # The GitHub cache of the repository has a limit of 10 GB, and a push to main saves a new compile-cache entry
  # (about 42 MB, its key holds the hash of the sources) and a new Swatinem rust-cache entry per job. Nothing
  # removed the old ones, and the limit was reached. This job runs after the other three on a push to main and
  # deletes what no later run can use:
  #   compile-cache-*  keeps the newest 3 (the last commits; an entry of another commit is never a hit,
  #                    there is no restore key), removes the rest.
  #   v0-rust-*        keeps the newest entry of each prefix, the key without its two trailing hashes
  #                    (one prefix per job, operating system and architecture), removes the older ones.
  # A failure of the API call or of `gh` never fails the build: the job and each step are continue-on-error, and
  # a cache that stays full is only slower. Only a push to main runs it (not a pull request, and not
  # release-tag.yml, which calls this workflow). Needs `actions: write`.
  cache-cleanup:
    name: cache cleanup
    needs: [test, portable, corpus, release-tests]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete the old compile-cache entries (keep the newest 3)
        continue-on-error: true
        run: |
          ids=$(gh cache list --key compile-cache- --sort created_at --order desc --limit 100 --json id --jq '.[3:][].id')
          for id in $ids; do
            echo "deleting compile-cache entry $id"
            gh cache delete "$id" || true
          done
      - name: Delete the old rust-cache entries (keep the newest of each prefix)
        continue-on-error: true
        run: |
          ids=$(gh cache list --key v0-rust- --limit 100 --json id,key,createdAt --jq '
            map(. + {prefix: (.key | sub("-[0-9a-f]{8,}-[0-9a-f]{8,}$"; ""))})
            | group_by(.prefix)
            | map(sort_by(.createdAt) | reverse | .[1:][].id)
            | .[]')
          for id in $ids; do
            echo "deleting rust-cache entry $id"
            gh cache delete "$id" || true
          done
