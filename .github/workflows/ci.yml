name: CI

# Every push and PR: lint, unit + contract tests, then the corpus pass-rate report. The daily
# schedule produces one report per day even without pushes, which gives the pass-rate curve (one
# `pass-rate-<date>` artifact per day).
#
# Three jobs run in parallel, each on its own runner, so the wall time is that of the slowest one:
#
#   test           format, clippy, and every test that runs in a plain debug `cargo test`
#   corpus         release build, the corpus pass rate for every BC version, and the demand-driven
#                  compile against the eager compile (the normal run first and alone, then the three eager runs side by side)
#   release-tests  everything that needs an optimised build: the perf budgets, the tests that run
#                  the finished `al-test-cli` over the whole corpus, and the network tests
#
# Nothing is dropped by the split. The two test files that run the `al-test-cli` binary over the
# whole pinned corpus (`corpus_harness`, `dev_tooling`) are gated behind the `cli-e2e` feature of
# al-test-cli, which is on by default (so `cargo test` and `check.sh` still run them). The `test` job
# builds with `--no-default-features`, because the unoptimised binary needs minutes for them, and the
# `release-tests` job runs them with the release binary.

on:
  push:
    branches: [main, release]
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  # release-tag.yml runs the same checks before it builds a numbered alpha.
  workflow_call:

env:
  # The built sidecar, for the sidecar tests and the corpus run. A missing .NET fails, not skips.
  ALRT_DOTNET_SIDECAR: ${{ github.workspace }}/target/dotnet-sidecar/AlDotNetSidecar.dll
  ALRT_REQUIRE_DOTNET: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Line tables are enough for a panic's location; full debug info made the debug test build
      # about a third slower and the dependency cache four times larger.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      # Default features: clippy also lints the two corpus-wide test files.
      - run: cargo clippy --all-targets -- -D warnings
      # Without the cli-e2e feature: `corpus_harness` and `dev_tooling` run in the release-tests job.
      - run: cargo test --workspace --no-default-features

  # Fails when a dependency has a license that is not on the allow-list in deny.toml.
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2.0.20
        with:
          command: check
          command-arguments: licenses

  # The release builds macOS and Windows binaries. A compile error that only those targets show
  # (a Unix-only call, a missing OS function) must fail the push, not the release. Check only: no
  # link, no tests. Test code of the workspace is not checked on Windows.
  portable:
    name: portable check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace

  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup

      # One release build serves the corpus runs below. rust-cache keeps dependencies only.
      - name: Build release binary
        run: cargo build --release -p al-test-cli

      # ADR-013 Layer A. The corpus names test-library apps that no .alpackages holds (System
      # Application Test Library, Permissions Mock, Any). They come from Microsoft's artifact feed
      # by range reads: about 1.5 MB per BC build out of a 1.3 GB artifact. Nothing is committed.
      # The cache is keyed by the newest published build of each oracle version, so a run on a
      # known build makes no request for the artifact. `--print-builds` reads only the 90 KB index.
      - name: Newest BC builds
        id: bc
        run: |
          ./target/release/al-test-cli --all-versions --print-builds | tee bc-builds.txt
          echo "key=$(tr ' \n' '--' < bc-builds.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/al-runtime/artifacts
          key: bc-artifacts-${{ steps.bc.outputs.key }}
      - name: Fetch dependency apps (warms the cache)
        run: ./target/release/al-test-cli --all-versions --fetch-deps

      # ADR-022. The compile cache holds the lowered form of the dependency apps, made on this
      # runner from the downloaded apps; it is saved with actions/cache and never uploaded
      # anywhere else. The key names the BC builds (the apps) and the sources of the runtime (the
      # entry file's own key also holds a hash of the executable, so a build that differs misses
      # and rebuilds). No restore-keys: an entry of another build is never usable.
      - name: Compile cache, restore
        uses: actions/cache@v4
        with:
          path: ~/.cache/al-runtime/compile
          key: compile-cache-${{ steps.bc.outputs.key }}-${{ hashFiles('Cargo.lock', 'crates/**/*.rs') }}
      # Builds the entry of each version when it is not there, or reads and checks every block of
      # the one that is. The measured run below is then always a cache hit, and the time of the
      # build is reported on its own line.
      - name: Compile cache, build or verify
        run: |
          ./target/release/al-test-cli --all-versions --build-compile-cache | tee cache-build.txt

      # The corpus pass rate fails the job on any regression against metrics/<major>/passing.txt of
      # every version in oracle/oracle.toml (exit 1), or when the oracle and the corpus pin disagree
      # (exit 2).
      #
      # ADR-013 decision 6: the demand-driven compile of the dependency apps must never change an
      # outcome. The corpus runs a second time with every dependency routine compiled
      # (`AL_EAGER_DEPENDENCIES=1`), and no test may come out differently (pass, fail or not run).
      # A test the demand-driven compile refuses and the eager one runs shows up here as well:
      # that is a path BC runs and the demand-driven compile did not reach. `tools/demand_vs_eager.sh`
      # compares the main app and every extra suite and prints each difference with both reasons;
      # locally, `tools/demand_vs_eager.sh run` makes the runs and the comparison.
      #
      # The normal run (all versions, one process: it prints the comparison across versions) goes
      # first and alone, so the times in its "How long it took" tables are the runtime's own, not
      # slowed by other runs. Then one eager run per version goes side by side (a corpus run uses
      # one core, the runner has four). The runs share no files (the dependency cache is only read
      # after the step above) and each stays well under 3 GB.
      - name: Corpus pass rate, and the demand-driven compile against the eager compile
        run: |
          step_start=$(date +%s)
          status=0
          ./target/release/al-test-cli --all-versions --require-dotnet \
            --json pass-rate.json --markdown pass-rate.md --junit runtime-junit.xml || status=1
          normal_end=$(date +%s)
          # One line per BC version: pass, fail, not run, rate and total time. Areas, phases and
          # suites are in pass-rate-<v>.json and in the log.
          {
            echo "## Corpus pass rate"
            echo
            cat pass-rate-*.md
          } >> "$GITHUB_STEP_SUMMARY"

          # --no-ratchet: the allow-listed differences fail the ratchet; compare_junit is the check.
          # --json keeps each eager run's phase times (every report has them).
          eager_pids=()
          for v in 27 28 29; do
            AL_EAGER_DEPENDENCIES=1 ./target/release/al-test-cli --bc-version $v --require-dotnet --no-ratchet \
              --junit eager-junit-$v.xml --json eager-report-$v.json > eager-$v.log 2>&1 &
            eager_pids+=($!)
          done
          i=0
          eager_reports=()
          for v in 27 28 29; do
            wait "${eager_pids[$i]}" || { echo "::error::the eager run for BC $v failed"; status=1; }
            i=$((i + 1))
            echo "::group::Eager run output, BC $v"
            cat eager-$v.log
            echo "::endgroup::"
            if [ -f eager-report-$v.json ]; then
              eager_reports+=(--timings-table eager-report-$v.json)
            fi
          done
          eager_end=$(date +%s)
          # The main app of each version and every extra suite (OnPrem, the isolation probes).
          tools/demand_vs_eager.sh compare . || status=1
          step_end=$(date +%s)

          {
            echo
            echo "## How the time of this step adds up"
            echo
            echo "- The normal run of all versions, alone on the runner: $((normal_end - step_start)) s."
            echo "- The three runs that compile every dependency, side by side: $((eager_end - normal_end)) s."
            echo "- The comparison of the two: $((step_end - eager_end)) s."
            echo "- The step in total: $((step_end - step_start)) s."
            echo
            echo "The \"How long it took\" tables above are from the normal run, which had the runner to"
            echo "itself. The runs that compile every dependency exist only to check that the normal run"
            echo "skips nothing a test needs. They are not part of the runtime's time."
            if [ ${#eager_reports[@]} -gt 0 ]; then
              echo
              echo "Runs that compile every dependency, for comparison (three at a time on 4 vCPUs):"
              echo
              ./target/release/al-test-cli "${eager_reports[@]}"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status

      # ADR-022. The measured run: every dependency app comes from the compile cache
      # (`--require-compile-cache` turns a miss into an error). Its outcomes must be those of the
      # normal run above for every test, with no exception (owner decision of 2026-10-14; the
      # list tools/demand-eager-known-differences.txt is empty). The job summary has the times
      # with the cache on; the time to build the cache is a line of its own.
      - name: Corpus with the compile cache, against the uncached run
        run: |
          status=0
          ./target/release/al-test-cli --all-versions --require-dotnet --no-ratchet --require-compile-cache \
            --json cached-pass-rate.json --markdown cached-pass-rate.md --junit cached-junit.xml || status=1
          tools/cache_vs_uncached.sh compare . || status=1
          {
            echo
            echo "## With the compile cache"
            echo
            echo "One line per BC version, every dependency app taken from the cache (total time of the measured run):"
            echo
            cat cached-pass-rate-*.md
            echo
            echo "### Time to build the compile cache (not part of the times above)"
            echo
            grep "^compile cache build time" cache-build.txt | sed 's/^/- /' || true
            grep "^compile cache: BC" cache-build.txt | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      # ADR-013, "The baseline runs only when a selected test can observe it": the rule that skips the
      # install baseline must never change an outcome. This run starts every test codeunit the rule
      # calls free of the baseline on an empty store; no test may come out differently.
      - name: Install baseline rule, against the normal run
        run: |
          status=0
          AL_CHECK_BASELINE_RULE=1 ./target/release/al-test-cli --all-versions --require-dotnet --no-ratchet \
            --junit ruled-junit.xml > ruled.log 2>&1 || status=1
          tools/baseline_rule_check.sh compare . || status=1
          exit $status
      # Keeps the entries this run used and drops the rest, so the cache that is saved at the end of
      # the job holds only what the next run can use.
      - name: Compile cache, prune
        run: |
          used=$(grep -o '[^ ]*deps-[0-9a-f]*\.alcc' cache-build.txt | sort -u)
          for f in ~/.cache/al-runtime/compile/*.alcc; do
            [ -e "$f" ] || continue
            echo "$used" | grep -qx "$f" || { echo "pruned $f"; rm -f "$f"; }
          done

      - name: Date stamp
        if: always()
        id: date
        run: echo "d=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pass-rate-${{ steps.date.outputs.d }}-${{ github.run_id }}
          path: |
            pass-rate-*.json
            pass-rate-*.md
            runtime-junit-*.xml
            eager-junit-*.xml
            eager-report-*.json
            cached-pass-rate-*.json
            cached-pass-rate-*.md
            cached-junit-*.xml
            ruled-junit-*.xml
          retention-days: 90

  release-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup

      # Budgets (issue #1): the cold compile of the corpus in instructions per object (wall time is printed only: a shared runner
      # varies by 20 % from day to day), parser throughput at
      # least 50 MB/s, and the VM budget (ADR-031: instructions per iteration of the tests/vm-bench programs; where the runner
      # allows no hardware counter it falls back to CPU time with wider limits). #[ignore]d in plain `cargo test` because they only mean something in release.
      # This job runs nothing else at the same time, so the numbers are not disturbed.
      # CI has no instruction counter, so the CPU-time fallback only warns here (owner, 2026-10-20); with a counter the budgets fail.
      - name: Perf budgets
        run: |
          cargo test --release --no-fail-fast \
            -p al-syntax --test perf_parse_throughput \
            -p al-test-cli --test perf_budget \
            -p al-test-cli --test perf_vm \
            -p al-test-cli --test corpus_resolve_deps \
            -p al-test-cli --test platform_tables \
            -p al-data --lib \
            -- --ignored --nocapture

      # The tests that run `al-test-cli` over the whole pinned corpus and its oracle (`--no-deps`),
      # against the release binary. The `test` job leaves them out (see the header).
      - name: CLI end-to-end tests (corpus_harness, dev_tooling)
        run: |
          cargo test --release --no-fail-fast \
            -p al-test-cli --test corpus_harness \
            -p al-test-cli --test dev_tooling

      # ADR-050 decision 12: edits of the corpus app; per edit the --affected selection plus the stored outcomes of the
      # skipped codeunits must equal a full run (about 5 s per run, two runs per narrowed edit).
      - name: Affected selection differential
        run: |
          cargo test --release --no-fail-fast \
            -p al-test-cli --test affected_differential \
            -- --ignored --nocapture

      # The only tests that use the network: Microsoft's artifact feed, read by range. They use
      # fresh cache directories, so they check the protocol and the real archives, not a cache.
      - name: Artifact feed (network)
        run: |
          cargo test --release --no-fail-fast \
            -p al-deps --test network \
            -p al-test-cli --test network_deps \
            -- --ignored --nocapture

  # The GitHub cache of the repository has a limit of 10 GB, and a push to main saves a new compile-cache entry
  # (about 42 MB, its key holds the hash of the sources) and a new Swatinem rust-cache entry per job. Nothing
  # removed the old ones, and the limit was reached. This job runs after the other three on a push to main and
  # deletes what no later run can use:
  #   compile-cache-*  keeps the newest 3 (the last commits; an entry of another commit is never a hit,
  #                    there is no restore key), removes the rest.
  #   v0-rust-*        keeps the newest entry of each prefix, the key without its two trailing hashes
  #                    (one prefix per job, operating system and architecture), removes the older ones.
  # A failure of the API call or of `gh` never fails the build: the job and each step are continue-on-error, and
  # a cache that stays full is only slower. Only a push to main runs it (not a pull request, and not
  # release-tag.yml, which calls this workflow). Needs `actions: write`.
  cache-cleanup:
    name: cache cleanup
    needs: [test, portable, corpus, release-tests]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete the old compile-cache entries (keep the newest 3)
        continue-on-error: true
        run: |
          ids=$(gh cache list --key compile-cache- --sort created_at --order desc --limit 100 --json id --jq '.[3:][].id')
          for id in $ids; do
            echo "deleting compile-cache entry $id"
            gh cache delete "$id" || true
          done
      - name: Delete the old rust-cache entries (keep the newest of each prefix)
        continue-on-error: true
        run: |
          ids=$(gh cache list --key v0-rust- --limit 100 --json id,key,createdAt --jq '
            map(. + {prefix: (.key | sub("-[0-9a-f]{8,}-[0-9a-f]{8,}$"; ""))})
            | group_by(.prefix)
            | map(sort_by(.createdAt) | reverse | .[1:][].id)
            | .[]')
          for id in $ids; do
            echo "deleting rust-cache entry $id"
            gh cache delete "$id" || true
          done
