name: Nightly edge

# Fast-forward `release` to a commit of main that passed CI, then build and publish `edge` from it (edge.yml, called as a reusable workflow). Nothing
# happens when the published `edge` tag already contains that commit. Owner decision 2026-10-20: edge is a
# nightly build; numbered alphas stay manual (docs/releasing.md).
#
# "Nothing new" is decided against the `edge` tag (what is published), not against `release`. On
# 2026-11-10 (run 42845780913) the publish failed after `release` had already moved; the next run
# saw `release` containing the commit and skipped, so that build could never be published. Now a
# run whose commit is already the head of `release` but not yet on `edge` builds and publishes it
# again without pushing `release`.
#
# The push to `release` uses GITHUB_TOKEN, so it does not start CI or edge.yml a second time.
# That is wanted: the commit already passed CI on main. A person's push to `release` still
# runs CI and then edge.yml, as before.
#
# Which commit (owner decision 2026-11-04):
#   - (Removed 2026-11-09, see `on:`.) The scheduled run (02:17 UTC) took the newest commit of main whose scheduled (nightly) CI run
#     passed. Since 2026-11-04 the slow comparisons (eager, fresh, compile cache, baseline rule, perf
#     budgets, affected differential) run only in that CI run, and CI's schedule (00:17 UTC) ends
#     before this one. When the night's CI run failed or has not finished, the newest earlier one
#     that passed is used; that commit is usually already on `release`, so nothing is built.
#   - A manual run (workflow_dispatch) keeps the old rule: the newest commit of main whose CI run on
#     a push passed. The owner starts it during the day so outside reporters can test fresh fixes.
#     That push run has the pull request checks (or merge-check proved the pull request ran them on
#     the same tree) but not the slow comparisons.
#   - A manual run with the input `sha` (owner decision 2026-11-08) publishes exactly that commit.
#     It must be on main and have a successful CI run on a push to main; otherwise the run fails.
#     The local edge gate uses this: it tests one commit, then publishes that same commit, even when
#     main moved on meanwhile.

on:
  # No schedule (owner decision 2026-11-08): every edge build goes through the local edge gate, which
  # starts this workflow with the gated `sha`. A scheduled run published an ungated build on 2026-11-09.
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-character commit of main to publish (empty: newest main commit with green CI on a push)"
        required: false
        default: ""
      skip_macos:
        description: "Publish without the macOS archive (only when GitHub has no macOS runner; owner 2026-11-13)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly-edge
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      sha: ${{ steps.advance.outputs.sha }}
      build: ${{ steps.advance.outputs.build }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      INPUT_SHA: ${{ github.event.inputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: false
      - id: advance
        run: |
          # The scheduled run trusts the nightly CI run; a manual run the newest push run (see the header).
          if [ "$EVENT_NAME" = schedule ]; then ci_event=schedule; else ci_event=push; fi
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ -n "$INPUT_SHA" ]; then
            if ! [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::input sha must be a full 40-character lowercase hex commit"
              exit 1
            fi
            sha="$INPUT_SHA"
            ok="$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&head_sha=$sha&per_page=1" \
              -q '.total_count')"
            if [ "${ok:-0}" -eq 0 ]; then
              echo "::error::$sha has no successful CI run on a push to main"
              exit 1
            fi
            echo "Commit given by input: $sha"
          else
          sha="$(gh run list --workflow ci.yml --branch main --event "$ci_event" --status success \
            --limit 1 --json headSha -q '.[0].headSha')"
          if [ -z "$sha" ]; then
            echo "::error::no successful CI run on main found for the event $ci_event"
            exit 1
          fi
          fi
          echo "CI event trusted: $ci_event"
          echo "Commit to publish: $sha"
          git fetch origin release
          # The published tag; absent before the first edge build.
          git fetch --no-tags origin "+refs/tags/edge:refs/tags/edge" || true
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main"
            exit 1
          fi
          edge="$(git rev-parse -q --verify 'refs/tags/edge^{commit}' || true)"
          if [ -n "$edge" ] && git merge-base --is-ancestor "$sha" "$edge"; then
            echo "The edge tag ($edge) already contains $sha. Nothing new."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          release="$(git rev-parse origin/release)"
          if [ "$release" = "$sha" ]; then
            # An earlier run moved release here but did not publish (for example a failed tag push).
            echo "release is already at $sha but edge is not. Publishing it without pushing release."
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge-base --is-ancestor "$sha" origin/release; then
            # edge.yml publishes only the head of release, so an older commit cannot be published.
            echo "::error::release ($release) is ahead of $sha and edge is not published there. Run again with sha=$release."
            exit 1
          fi
          if ! git merge-base --is-ancestor origin/release "$sha"; then
            echo "::error::release has commits that main lacks (a hotfix without merge-back). See docs/releasing.md, section 3."
            exit 1
          fi
          # A fast-forward only: no --force. The push fails if release moved meanwhile.
          git push origin "$sha:refs/heads/release"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "build=true" >> "$GITHUB_OUTPUT"

  edge:
    needs: advance
    if: needs.advance.outputs.build == 'true'
    uses: ./.github/workflows/edge.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      sha: ${{ needs.advance.outputs.sha }}
      skip_macos: ${{ inputs.skip_macos == true }}
