name: Nightly edge

# Once a night: fast-forward `release` to the newest commit of main whose scheduled (nightly) CI run
# passed, then build and publish `edge` from it (edge.yml, called as a reusable workflow). Nothing
# happens when `release` already contains that commit. Owner decision 2026-10-20: edge is a
# nightly build; numbered alphas stay manual (docs/releasing.md).
#
# The push to `release` uses GITHUB_TOKEN, so it does not start CI or edge.yml a second time.
# That is wanted: the commit already passed CI on main. A person's push to `release` still
# runs CI and then edge.yml, as before.
#
# Owner decision 2026-11-04: the scheduled run, not the newest green push run. Since then a push
# run of a merged pull request skips the jobs the pull request already ran, and the slow
# comparisons (eager, fresh, compile cache, baseline rule, perf budgets, affected differential)
# run only in the scheduled run. CI's schedule (00:17 UTC) ends before this one (02:17 UTC).
# When the night's scheduled run failed or has not finished, the newest earlier one that passed
# is used, and that commit is usually already on `release`, so nothing is built.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-edge
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      sha: ${{ steps.advance.outputs.sha }}
      build: ${{ steps.advance.outputs.build }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: false
      - id: advance
        run: |
          sha="$(gh run list --workflow ci.yml --branch main --event schedule --status success \
            --limit 1 --json headSha -q '.[0].headSha')"
          if [ -z "$sha" ]; then
            echo "::error::no successful scheduled CI run on main found"
            exit 1
          fi
          echo "Newest main commit with green CI: $sha"
          git fetch origin release
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main"
            exit 1
          fi
          if git merge-base --is-ancestor "$sha" origin/release; then
            echo "release already contains $sha. Nothing new."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge-base --is-ancestor origin/release "$sha"; then
            echo "::error::release has commits that main lacks (a hotfix without merge-back). See docs/releasing.md, section 3."
            exit 1
          fi
          # A fast-forward only: no --force. The push fails if release moved meanwhile.
          git push origin "$sha:refs/heads/release"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "build=true" >> "$GITHUB_OUTPUT"

  edge:
    needs: advance
    if: needs.advance.outputs.build == 'true'
    uses: ./.github/workflows/edge.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      sha: ${{ needs.advance.outputs.sha }}
