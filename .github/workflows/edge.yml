name: Edge

# The rolling `edge` pre-release: the newest build of the `release` branch. When CI is green on a
# push to `release`, this rebuilds the three targets and REPLACES the assets of the one pre-release
# with the tag `edge`. The tag moves to the commit. No new tag or release per push, and edge is
# never "latest". See docs/releasing.md.
# nightly-edge.yml also calls this workflow (workflow_call) with the commit it fast-forwarded
# `release` to. That commit already passed CI on main, so the call publishes without a second
# CI run.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [release]
  workflow_call:
    inputs:
      sha:
        description: The commit of `release` to build and publish. It passed CI on main.
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels an older edge build.
concurrency:
  group: edge
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      publish: ${{ steps.plan.outputs.publish }}
      version_suffix: ${{ steps.plan.outputs.version_suffix }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          # Set only on a workflow_call (from nightly-edge.yml). There, github.event_name is the
          # caller's event (schedule or workflow_dispatch), so this input is checked first.
          CALL_SHA: ${{ inputs.sha }}
        run: |
          # The UTC date of this build, shown in `al-runner --version` as +edge.YYYYMMDD.
          echo "version_suffix=+edge.$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          if [ -n "$CALL_SHA" ]; then
            echo "Nightly build of $CALL_SHA."
            echo "sha=$CALL_SHA" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = workflow_dispatch ]; then
            echo "Dry run: builds the selected commit, publishes nothing."
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$CONCLUSION" = success ] && [ "$RUN_EVENT" = push ] && [ "$BRANCH" = release ]; then
            echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "CI did not succeed on a push to release; nothing to do."
            echo "sha=" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  package:
    needs: plan
    if: needs.plan.outputs.sha != ''
    uses: ./.github/workflows/build-packages.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      label: edge
      sha: ${{ needs.plan.outputs.sha }}
      version_suffix: ${{ needs.plan.outputs.version_suffix }}

  publish:
    needs: [plan, package]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Skip when release has moved on
        id: fresh
        run: |
          head="$(git ls-remote origin refs/heads/release | cut -f1)"
          if [ "$head" != "$SHA" ]; then
            echo "release is at $head, not $SHA. A newer build will publish."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Replace the edge release
        if: steps.fresh.outputs.stale != 'true'
        run: |
          previous="$(git rev-parse -q --verify 'refs/tags/edge^{commit}' || true)"
          if [ -n "$previous" ] && [ "$previous" != "$SHA" ]; then
            compare="https://github.com/$GH_REPO/compare/$previous...$SHA"
          else
            compare="https://github.com/$GH_REPO/commit/$SHA"
          fi
          cat > notes.md <<NOTES
          Rolling build of the \`release\` branch. Each build replaces the one before.

          - Commit: \`$SHA\`
          - Built: $(date -u +%Y-%m-%d) (UTC)
          - Changes since the previous edge build: $compare

          Windows binary signed; macOS and Linux not signed. Install: \`curl -fsSL https://github.com/$GH_REPO/releases/download/edge/install.sh | sh -s -- edge\`
          Windows: download \`install.ps1\` and run \`./install.ps1 -Version edge\`.
          For a numbered checkpoint, use the newest \`3.0.0-alpha.N\` release instead.
          NOTES
          sed -i 's/^          //' notes.md
          git tag -f edge "$SHA"
          git push -f origin refs/tags/edge
          if gh release view edge > /dev/null 2>&1; then
            gh release view edge --json assets -q '.assets[].name' | while read -r a; do
              gh release delete-asset edge "$a" -y
            done
            gh release upload edge dist/* --clobber
            gh release edit edge --prerelease --latest=false --draft=false \
              --title "al-runner edge ($(echo "$SHA" | cut -c1-9))" --notes-file notes.md
          else
            gh release create edge dist/* --prerelease --latest=false --verify-tag \
              --title "al-runner edge ($(echo "$SHA" | cut -c1-9))" --notes-file notes.md
          fi
