[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "3.0.0-alpha.4"
license = "BUSL-1.1"
authors = ["Stefan Maron"]
repository = "https://github.com/aldevtools/BusinessCentral.AL.Runner"
rust-version = "1.85"

[workspace.dependencies]
al-syntax = { path = "crates/al-syntax" }
al-sema = { path = "crates/al-sema" }
al-builtins = { path = "crates/al-builtins" }
al-ir = { path = "crates/al-ir" }
al-link = { path = "crates/al-link" }
al-vm = { path = "crates/al-vm" }
al-data = { path = "crates/al-data" }
al-host = { path = "crates/al-host" }
al-deps = { path = "crates/al-deps" }
al-version = { path = "crates/al-version" }
al-testrun = { path = "crates/al-testrun" }
al-cache = { path = "crates/al-cache" }
al-testkit = { path = "crates/al-testkit" }
quick-xml = "0.37"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.8"

# Debug builds (`cargo test`, `check.sh`, CI's test job). Issue #45 measured both settings on the
# shared 12-core machine (load average 4 to 5, CARGO_BUILD_JOBS=4):
# - Line tables are enough for a panic's location. Full debug info made the test binaries about
#   160 MB each (15 GB for the workspace) and the build after a merge 62 s instead of 38 s.
# - Dependencies at opt-level 1: the debug tests run in 24 s instead of 37 s. The dependencies
#   are built once per target directory (about 40 s more on a cold build) and only again when
#   Cargo.lock changes. The workspace crates stay at opt-level 0: at 1, the build after a merge
#   took 107 s instead of 38 s, more than the 14 s it saved in the tests.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

# The profile tools/bcdb-bench.sh builds the Rust side of the bcdb comparison with.
[profile.bcdb-bench]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
